name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Test studio
        run: python -m pytest studio/tests -v

      - name: Validate project manifests
        run: python studio/studio.py validate

      - name: Ensure ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: showcase/pnpm-lock.yaml

      - name: Install showcase dependencies
        working-directory: showcase
        run: pnpm install --frozen-lockfile

      - name: Publish curated media
        run: python studio/studio.py publish

      - name: Typecheck showcase
        working-directory: showcase
        run: pnpm typecheck

      - name: Build showcase
        working-directory: showcase
        run: pnpm build
